# YAML: highlighting from a Tree-sitter grammar compiled to WebAssembly, and
# YAML streams parsed for Flareite's schemas, which check each of their
# documents: SchemaStore's for well-known files (GitHub workflows, Compose
# files, and so on), the one a file names (# yaml-language-server:
# $schema=<address>), and those [[schemas.associations]] and extensions
# provide. Their keys and values are completed and described from what the
# schemas say. See Flareite's docs/extensions.md#languages and #schemas.
id = "flareite.yaml"
name = "YAML"
version = "1.0.0"
description = "YAML highlighting, and checking, completion, and hover from schemas."
author = "Flareite"
api_version = "2"
entrypoint = "target/wasm32-unknown-unknown/release/flareite_yaml.wasm"
activation = ["on-language:yaml"]

[engines]
flareite = ">=0.1.0"

# documents_read: reading YAML documents, to parse them for schemas.
[permissions]
documents_read = true

[build]
command = "cargo"
args = ["build", "--release"]
watch = ["src", "Cargo.toml"]

[[languages]]
id = "yaml"
name = "YAML"
file_extensions = ["yaml", "yml"]
# Tools' configuration files that are YAML without saying so.
file_names = [".clang-format", ".clang-tidy", ".clangd"]
grammar = "grammars/tree-sitter-yaml.wasm"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
line_comment = "#"
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["{", "}"], ["[", "]"]]
auto_closing_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  { open = '"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = "'", close = "'", not_in = [
    "string",
    "comment",
  ] },
]
surrounding_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  [
    '"',
    '"',
  ],
  [
    "'",
    "'",
  ],
  [
    "`",
    "`",
  ],
]

[[completion_providers]]
languages = ["yaml"]
trigger_characters = [":", " "]

[[hover_providers]]
languages = ["yaml"]
